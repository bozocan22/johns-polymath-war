# TWO DIFFERENT COMPILER CRASHES LOOK IDENTICAL HERE. READ THIS BEFORE
# DELETING THE CODE YOU JUST WROTE.
#
# Both surface as the same abrupt, diagnostic-free line:
#
#     process didn't exit successfully: rustc.exe ...
#     (exit code: 0xc0000409, STATUS_STACK_BUFFER_OVERRUN)
#
# 0xc0000409 is not "stack overflow". It is Windows' __fastfail, which is
# what `abort()` compiles to - and rustc aborts for BOTH of these:
#
#   (a) genuine stack exhaustion in a deeply recursive query, and
#   (b) HEAP exhaustion, via `std::alloc::rust_oom` ->
#       `handle_alloc_error` -> abort.
#
# Telling them apart takes ten seconds: run the failing command again and
# read the backtrace rustc prints ABOVE the cargo error. If the frames say
#
#     std::alloc::rust_oom / handle_alloc_error / hashbrown ... alloc_err
#
# it is (b), an OUT-OF-MEMORY, and nothing in this file will help you.
# RUST_MIN_STACK cannot buy heap.
#
# MEASURED, 2026-08-12, on `cargo test -p jk_tdm --no-run`:
#   - one rustc typechecking the whole 76k-line jk_tdm crate with --test
#     peaks at ~3.7 GB of private bytes. That is large but not extreme.
#   - this machine has ~7.3 GB RAM and a ~22 GB pagefile, so ~29 GB of
#     commit for everything.
#   - the OOM reproduced only while THREE concurrent
#     `cargo build --release -p jk_tdm` runs (from the second working copy
#     at C:\Users\bozov\awmwt) had the commit charge down to ~3 GB free.
#     On a quiet machine the same command typechecked the whole crate.
#
# So case (b) here has been CONTENTION, not crate size: two sessions each
# starting a release build of a Bevy tree will starve a third. If you hit
# it, check `Get-Process rustc` before you refactor anything - and prefer
# `-j 1` for the jk_tdm crate itself, whose single rustc is the expensive
# one.
#
# Note also that splitting tests BETWEEN FILES of this crate cannot reduce
# rustc's memory: one crate is one rustc process with one arena that is
# never freed until it exits. Only moving code to a DIFFERENT CRATE helps.
#
# ---------------------------------------------------------------------
# The stack setting below is for case (a), which is real and has bitten
# this workspace before. 128 MB is far more than measured need - the point
# is headroom, so this does not have to be revisited as files grow.
[env]
RUST_MIN_STACK = "134217728"
